name: Release

# Publishes `slidesaurus` to npm when a `v*` tag is pushed.
# Requires the protected GitHub environment `npm` and npm trusted publishing
# (OIDC) — see docs "Security" page / SECURITY.md. No long-lived token needed.

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  publish:
    name: Build, test & publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: npm
    permissions:
      contents: read
      id-token: write # npm provenance + trusted publishing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        timeout-minutes: 10
        run: pnpm install --frozen-lockfile

      - name: Check the tag matches the package version
        run: |
          VERSION=$(node -p "require('./packages/slidesaurus/package.json').version")
          if [ "${GITHUB_REF_NAME}" != "v${VERSION}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match package version ${VERSION}"; exit 1
          fi

      - name: Type check
        run: pnpm typecheck

      - name: Build plugin
        run: pnpm build:plugin

      - name: Unit tests
        run: pnpm --filter slidesaurus test

      - name: Integration tests
        run: pnpm --filter slidesaurus test:integration

      # Authenticated through npm trusted publishing (OIDC, npm >= 11.5.1 as
      # shipped with Node 24): no NPM_TOKEN secret is used or needed.
      - name: Publish with provenance
        working-directory: packages/slidesaurus
        run: pnpm publish --provenance --access public --no-git-checks
