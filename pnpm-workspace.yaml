packages:
  - "packages/*"
  - "apps/*"

# Supply-chain hardening (pnpm >= 10.16)

# Never install a version published less than 24 h ago (minutes): leaves time
# for the registry / community to pull a compromised release.
minimumReleaseAge: 1440

# Fail `pnpm install` when a dependency has a build script that is neither in
# `onlyBuiltDependencies` nor in `ignoredBuiltDependencies` (the allowlist
# lives in the root package.json "pnpm" field).
strictDepBuilds: true

# `trustPolicy: no-downgrade` is intentionally NOT enabled: it makes a
# non-frozen `pnpm install` / `pnpm update` fail on widespread legitimate
# packages (e.g. undici-types@6.21.0 via @types/node, published without
# provenance after earlier versions had it: ERR_PNPM_TRUST_DOWNGRADE).

# Audit allowlist: only for advisories WITHOUT an available fix, each with a
# justification (see docs "Security" page). Keep empty otherwise.
auditConfig:
  ignoreGhsas:
    # http-cache-semantics <=4.2.0: no patched version; dev-only transitive
    # (@docusaurus/core > update-notifier), not shipped in the package.
    - GHSA-ch52-4w7c-c8xp
    # braces <=3.0.3: no patched version; dev-only transitive
    # (@slidev/cli > fast-glob), build-time glob on trusted input.
    - GHSA-vfj7-8cjw-p6xm
